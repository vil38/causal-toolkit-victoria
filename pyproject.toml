[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-toolkit-victoria"
version = "0.1.0"
description = "A Python package for causal inference methods including ATE estimation, propensity score methods, and meta-learners"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Victoria", email = "vli3@uchicago.edu"}
]
keywords = ["causal inference", "statistics", "machine learning", "treatment effects"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.2.0",
    "lightgbm>=3.3.0",
    "patsy>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
]

# Lets `uv run pytest` install pytest automatically
[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/vil38/causal-toolkit-victoria"
Documentation = "https://github.com/vil38/causal-toolkit-victoria#readme"
Repository = "https://github.com/vil38/causal-toolkit-victoria"
"Bug Tracker" = "https://github.com/vil38/causal-toolkit-victoria/issues"

[tool.setuptools]
packages = ["causal_toolkit_victoria"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=causal_toolkit_victoria --cov-report=term"
